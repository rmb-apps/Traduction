name: Build Traduction APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o traduction.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: traduction
        run: |
          flutter create --org com.rmb --project-name traduction --platforms android .
          python3 tool/patch_android.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --dart-define=OCR_SPACE_KEY=${{ secrets.OCR_SPACE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: traduction-apk
          path: traduction/build/app/outputs/flutter-apk/app-release.apk
