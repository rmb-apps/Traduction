name: Build Traduction APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o traduction.zip
      - name: Check translation service
        continue-on-error: true
        run: curl -sS -m 20 'https://api.mymemory.translated.net/get?q=bonjour&langpair=fr|ar&de=rmb.contact147@gmail.com'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: traduction
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flutter create --org com.rmb --project-name traduction --platforms android .
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          fi
          python3 tool/patch_android.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=OCR_SPACE_KEY=${{ secrets.OCR_SPACE_KEY }}
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=OCR_SPACE_KEY=${{ secrets.OCR_SPACE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: traduction-apk
          path: traduction/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: traduction-aab-play-store
          path: traduction/build/app/outputs/bundle/release/app-release.aab
